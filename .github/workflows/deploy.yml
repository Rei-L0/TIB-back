name: Deploy to ECS Fargate (ARM)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: tib-backend-dev
  ECS_CLUSTER: tib-cluster-dev
  ECS_SERVICE: tib-backend-service-dev
  TASK_FAMILY: tib-backend-dev
  CONTAINER_NAME: tib-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # AWS 인증 (OIDC)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-role
        aws-region: ${{ env.AWS_REGION }}

    # ECR 로그인
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # 이미지 태그
    - name: Set image tag
      run: |
        echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
        echo "ECR_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}" >> $GITHUB_ENV

    # ARM 이미지 빌드 & 푸시
    - name: Build and push ARM Docker image
      run: |
        docker buildx create --use
        docker buildx build \
          --platform linux/arm64 \
          -t $ECR_IMAGE \
          --push .

    # 기존 Task Definition 가져오기
    - name: Get current task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.TASK_FAMILY }} \
          --query taskDefinition \
          > taskdef.json

    # 이미지 교체 + 불필요 필드 제거
    - name: Render new task definition
      run: |
        jq '
          .containerDefinitions
          |= map(if .name == "${{ env.CONTAINER_NAME }}"
                 then .image = env.ECR_IMAGE
                 else .
                 end)
          | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
        ' taskdef.json > new-taskdef.json

    # 새 Task Definition Revision 등록
    - name: Register new task definition
      run: |
        aws ecs register-task-definition \
          --cli-input-json file://new-taskdef.json

    # ECS Service 업데이트 (무중단)
    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.TASK_FAMILY }} \
          --force-new-deployment
